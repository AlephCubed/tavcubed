bitflags = "2.11"
bytemuck = "1.25"
crossbeam-channel = "0.5"
image = "0.25"
noiz = "0.5.0-rc.1"
serde = "1.0"
toml = "1.1"

[dev-dependencies]
criterion = "0.8"

[patch.crates-io]
bevy_auto_plugin = { path = "../bevy_auto_plugin" }
noiz = { path = "../noiz" }

